# Pre-commit hooks for ShopStack
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files
#
# The WCAG audit runs the static 13-criterion checker. Score threshold
# is enforced in CI (.github/workflows/wcag.yml); this hook gives the
# same feedback locally before pushing.

repos:
  - repo: local
    hooks:
      - id: wcag-audit
        name: WCAG 2.1 AA audit
        description: Run the static WCAG 2.1 AA audit and fail if score drops below 85.
        entry: uv run python -m shopstack.tools.audit_wcag
        language: system
        pass_filenames: false
        always_run: true
        # Don't fail the commit on a score drop; surface the report.
        # CI is the gate. To enforce locally, change to:
        #   args: ["--strict"]

      - id: doc-health
        name: Doc health audit
        description: Scan Docs/*.md for stale test counts, stale completion claims, and missing/old 'Last updated' dates.
        entry: uv run python -m shopstack.tools.doc_health --strict
        language: system
        pass_filenames: false
        always_run: true
        # Strict by default — blocks the commit if stale test counts are found.
        # The pre-commit hook uses --strict so the developer catches issues
        # locally before CI.

      - id: js-syntax-validate
        name: JS snippet syntax validation
        description: Walk every `js=...` kwarg in shopstack/ and validate via `node --check`. Catches SyntaxError at commit time so a broken Gradio JS helper doesn't ship and produce infinite "Loading..." spinners (Item #56, motto_v3 §0.5).
        entry: uv run python -m shopstack.tools.js_validate
        language: system
        pass_filenames: false
        always_run: true
        # Non-strict: the validator exits 0 when there are 0 errors,
        # 1 when there are errors. The hook fails the commit on any
        # SyntaxError. Disable with `SKIP=js-syntax-validate git commit ...`
        # when refactoring large UI files in a multi-commit workstream.
