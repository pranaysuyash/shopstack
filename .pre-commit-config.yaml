# Pre-commit hooks for ShopStack.
#
# This file is the local complement to the CI quality gates in
# .github/workflows/quality-gates.yml. The CI catches regressions
# on push/PR; the pre-commit hooks catch them at commit time so
# authors see the error before pushing.
#
# To install: `uv run pre-commit install`
# To run manually: `uv run pre-commit run --all-files`
#
# The hooks call the canonical tools in shopstack.tools/ — the
# same scripts CI runs. Single source of truth.
#
# Per motto_v3 §0.5 (Evidence Tiers): pre-commit is Tier 1 (static
# inspection). It catches the *common* failure mode (JS syntax
# errors, copy violations, stale state dashboards) at the
# cheapest possible tier.

repos:
  - repo: local
    hooks:
      - id: js-syntax-validate
        name: JS snippet syntax validator
        entry: uv run python -m shopstack.tools.js_validate
        language: system
        types: [python]
        pass_filenames: false
        description: >
          Catches SyntaxErrors in `app.load(None, js=...)` and
          `.click(..., js=...)` calls. Fails the commit if any
          snippet has a SyntaxError (motto_v3 §0.5 Tier 1).
        stages: [commit, push]

      - id: copy-audit
        name: Consumer copy audit
        entry: uv run python -m shopstack.tools.copy_audit
        language: system
        types: [python]
        pass_filenames: false
        description: >
          Catches engineering jargon in user-facing UI strings
          (e.g. "Save Trace", "Lot ID", "JSONL"). Fails the
          commit if the audit reports > 0 violations.
        stages: [commit, push]

      - id: state-dashboard
        name: State dashboard generator
        entry: uv run python -m shopstack.tools.generate_state
        language: system
        types: [python]
        pass_filenames: false
        description: >
          Regenerates Docs/SYSTEM_STATE.md and the JSON dashboard
          so the canonical current-state doc is always in sync
          with the actual project.
        stages: [pre-push]
