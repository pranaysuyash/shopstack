name: WCAG Audit

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wcag:
    name: Static WCAG 2.1 AA audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run WCAG 2.1 AA audit
        id: audit
        run: |
          uv run python -m shopstack.tools.audit_wcag > wcag_output.txt 2>&1
          cat wcag_output.txt
        continue-on-error: true

      - name: Enforce score threshold (≥ 85)
        run: |
          SCORE=$(uv run python -c "
          from shopstack.tools.audit_wcag import run_audit
          r = run_audit('.')
          print(r.score)
          ")
          echo "WCAG score: $SCORE / 100"
          if [ "$SCORE" -lt 85 ]; then
            echo "::error::WCAG score $SCORE is below the 85 threshold."
            echo "Fix the failing criteria listed in Docs/WCAG_AUDIT_2026-06-13.md"
            exit 1
          fi
          echo "WCAG score $SCORE meets the 85 threshold."

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wcag-audit-report
          path: |
            wcag_output.txt
            Docs/WCAG_AUDIT_*.md
          if-no-files-found: ignore
