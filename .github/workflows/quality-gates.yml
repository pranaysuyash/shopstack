name: Quality Gates

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Copy audit (engineering jargon in UI) ─────────────────────
  copy-audit:
    name: Consumer copy audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run copy audit
        id: copy
        run: |
          python -m shopstack.tools.copy_audit
          # Exit code: 0 = clean, 1 = violations found.
          # We check the report's count to fail only on real
          # regressions (the audit may be 0 on a clean run; if
          # it's > 0 we fail).
          COUNT=$(python -c "import json; d=json.load(open('Docs/COPY_AUDIT.json')); print(d['violation_count'] if 'violation_count' in d else len(d.get('violations', [])))")
          echo "Copy audit: $COUNT violations"
          if [ "$COUNT" -gt 0 ]; then
            echo "::error::Consumer copy audit found $COUNT violations."
            echo "See Docs/COPY_AUDIT.md for the list."
            exit 1
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: copy-audit-report
          path: |
            Docs/COPY_AUDIT.md
            Docs/COPY_AUDIT.json
          if-no-files-found: ignore

  # ── JS validator (SyntaxError in app.load/click js= snippets) ──
  js-validate:
    name: JS snippet validator
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Node.js (for node --check)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run JS validator
        id: js
        run: |
          python -m shopstack.tools.js_validate
          ERRORS=$(python -c "import json; d=json.load(open('Docs/JS_VALIDATION.json')); print(d.get('error_count', 0))")
          echo "JS validator: $ERRORS syntax errors"
          if [ "$ERRORS" -gt 0 ]; then
            echo "::error::JS validator found $ERRORS syntax errors."
            echo "See Docs/JS_VALIDATION.json for the list."
            exit 1
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: js-validation-report
          path: Docs/JS_VALIDATION.json
          if-no-files-found: ignore

  # ── State dashboard (canonical current-state) ─────────────────
  state-dashboard:
    name: State dashboard generator
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Generate state dashboard
        id: state
        run: |
          python -m shopstack.tools.generate_state
          # Check for test-count drift (the report reads pytest
          # --collect-only and fails if the count is implausible).
          TESTS=$(python -c "import json; d=json.load(open('Docs/STATE_DASHBOARD.json')); print(d['test_count'])")
          echo "State dashboard: $TESTS tests"
          if [ "$TESTS" -lt 100 ]; then
            echo "::error::State dashboard reports only $TESTS tests — something is broken."
            exit 1
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: state-dashboard
          path: |
            Docs/SYSTEM_STATE.md
            Docs/STATE_DASHBOARD.json
          if-no-files-found: ignore
